[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "war-simulation"
version = "0.1.0"
description = "A Sugarscape-style agent-based model for simulating international conflicts"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.4.3",
    "typing-extensions>=4.8.0",
] 